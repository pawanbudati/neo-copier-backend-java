server.port=${PORT:3000}
spring.application.name=neo-copier-backend-java

# Java Virtual Threads
spring.threads.virtual.enabled=true

# Database Configuration (Automatically parses PostgreSQL URI from .env or DATABASE_URL)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logging to File & Console
logging.file.name=./data/app.log
logging.level.root=INFO
logging.level.com.neocopier=INFO

# Application Config Defaults
admin.password=${ADMIN_PASSWORD:admin}
auth.enabled=${AUTH_ENABLED:false}
kotak.api.base=https://mis.kotaksecurities.com
python.command=${PYTHON_CMD:}

# Upstox API Config Defaults
upstox.api.key=${UPSTOX_API_KEY:}
upstox.api.secret=${UPSTOX_API_SECRET:}
upstox.redirect.uri=${UPSTOX_REDIRECT_URI:http://localhost:3000/api/upstox/callback}
upstox.access.token=${UPSTOX_ACCESS_TOKEN:}
